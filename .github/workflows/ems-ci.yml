# EMS CI — trigger-plan Phase A / Foundation gate.
# Inert until the workspace becomes a git repo (the user chose "no git yet"); it then runs
# on push/PR touching the ems/ module or the shared conformance vectors.
#
# `mvn verify` runs, in order:
#   - unit tests  (Surefire, *Test)      — incl. CanonicalConformanceTest (A6 cross-engine lock)
#   - integration (Failsafe, *IT)        — incl. FlywayMigrationIT (Testcontainers PostgreSQL 16;
#                                            Docker is preinstalled on ubuntu-latest runners)
# This is the Foundation exit criterion: `flyway migrate` + generated columns + conformance green.
name: ems-ci

on:
  push:
    paths:
      - 'ems/**'
      - 'shared/canonical-conformance/**'
      - '.github/workflows/ems-ci.yml'
  pull_request:
    paths:
      - 'ems/**'
      - 'shared/canonical-conformance/**'
      - '.github/workflows/ems-ci.yml'
  # The §12 perf harness is manual-only — see the `perf` job.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build, unit + integration tests
        working-directory: ems
        run: mvn -B --no-transfer-progress verify

      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ems-test-reports
          path: |
            ems/target/surefire-reports/
            ems/target/failsafe-reports/
          if-no-files-found: ignore

  # Runs in parallel with `build`. The chart can break in ways the Java build cannot see: a cutover
  # default flipped by a values override, an observability object dropped, a secret arriving as an env
  # var, or an alert expression that is valid PromQL against a metric that does not exist.
  # (`ems/deploy/**` needs no separate path trigger — it is inside `ems/**` already.)
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      # Invoked through bash rather than relying on the executable bit: the workspace is not a git repo,
      # so no file mode is being tracked for the checkout to restore.
      - name: Chart gate (lint, render, cutover defaults, secret hygiene)
        run: bash ems/deploy/helm/check.sh

      # promtool parses the alert expressions properly — AlertRuleCoverageTest checks that the metric
      # NAMES exist, this checks that the PromQL around them is valid. The two are complementary: a
      # syntactically perfect rule against a misspelled metric passes here and fails there.
      - name: Render alert rules for promtool
        run: |
          mkdir -p rendered
          helm template ems ems/deploy/helm/ems \
            --set kafka.bootstrapServers=kafka.example:9093 \
            --set consumer.topics=edf.events \
            --set edf.baseUrl=https://edf.example \
            --set airflow.baseUrl=https://airflow.example/api/v1 \
            --set auth.issuerUri=https://login.microsoftonline.com/tenant/v2.0 \
            --set auth.groups.dispatcher=id-dispatcher \
            --set auth.groups.admin=id-admin \
            --set auth.groups.ci=id-ci \
            --set dispatch.enabled=true \
            --output-dir rendered > /dev/null
          # promtool wants a bare rules file; the chart ships a PrometheusRule CR, so unwrap .spec.
          yq '.spec' rendered/ems/templates/prometheusrule.yaml > rendered/ems-rules.yaml
          cat rendered/ems-rules.yaml

      - name: promtool check rules
        run: |
          docker run --rm -v "${PWD}/rendered:/rules" --entrypoint promtool \
            prom/prometheus:latest check rules /rules/ems-rules.yaml

  # §12 perf gate. workflow_dispatch ONLY: the harness seeds ~10 M events and would otherwise cost that
  # on every push. One manual click, and the run uploads ems/target/perf-report.txt as the before/after
  # evidence artifact §12 asks for.
  perf:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Perf harness
        working-directory: ems
        run: mvn -B --no-transfer-progress verify -Pperf

      - name: Publish perf report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ems-perf-report
          path: |
            ems/target/perf-report.txt
            ems/target/failsafe-reports/
          if-no-files-found: ignore
