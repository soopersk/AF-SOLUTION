apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ems.fullname" . }}
  labels:
    {{- include "ems.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.strategy.maxSurge }}
      maxUnavailable: {{ .Values.strategy.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "ems.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ems.selectorLabels" . | nindent 8 }}
      annotations:
        # Rolls the pods when non-secret wiring changes. Without this a `helm upgrade` that only edits
        # the ConfigMap leaves every running pod on the old values, silently.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.vault.enabled }}
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: {{ .Values.vault.role | quote }}
        {{- range .Values.vault.secrets }}
        vault.hashicorp.com/agent-inject-secret-{{ .name }}: {{ .path | quote }}
        # The template body is Vault's own Go template and lives in values.yaml on purpose: values files
        # are not rendered by Helm, so its own delimiters survive intact instead of fighting the chart's.
        # (A YAML comment is NOT a template comment — braces here would be evaluated.)
        vault.hashicorp.com/agent-inject-template-{{ .name }}: |
          {{- .template | nindent 10 }}
        {{- end }}
        {{- end }}
    spec:
      {{- if .Values.azure.workloadIdentity.enabled }}
      serviceAccountName: {{ include "ems.fullname" . }}
      {{- end }}
      containers:
        - name: ems
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          # Bulk non-secret wiring. Container `env` below wins over `envFrom`, which is why the two
          # cutover-critical settings stay here, visible on the workload rather than buried in a ConfigMap.
          envFrom:
            - configMapRef:
                name: {{ include "ems.fullname" . }}
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.springProfile | quote }}
            - name: EMS_DISPATCH_ENABLED
              value: {{ .Values.dispatch.enabled | quote }}
            - name: EMS_CONSUMER_ENABLED
              value: {{ .Values.consumer.enabled | quote }}
            {{- if .Values.vault.enabled }}
            # Secrets are FILES, never env vars: an env var is visible in `kubectl describe pod` and in
            # every crash dump. Vault Agent renders them into /vault/secrets and Spring imports them as
            # additional config; `optional:` means a pod still starts if a family is not provisioned.
            - name: SPRING_CONFIG_IMPORT
              value: {{ .Values.vault.configImport | quote }}
            {{- end }}
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
