apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ems.fullname" . }}
  labels:
    {{- include "ems.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.strategy.maxSurge }}
      maxUnavailable: {{ .Values.strategy.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "ems.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ems.selectorLabels" . | nindent 8 }}
      {{- if .Values.vault.enabled }}
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: {{ .Values.vault.role | quote }}
        # Secret templates (Airflow basic auth, Azure OAuth, EDF keys, JKS) added per env.
      {{- end }}
    spec:
      {{- if .Values.azure.workloadIdentity.enabled }}
      serviceAccountName: {{ include "ems.fullname" . }}
      {{- end }}
      containers:
        - name: ems
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.springProfile | quote }}
            - name: EMS_DISPATCH_ENABLED
              value: {{ .Values.dispatch.enabled | quote }}
            - name: EMS_CONSUMER_ENABLED
              value: {{ .Values.consumer.enabled | quote }}
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
