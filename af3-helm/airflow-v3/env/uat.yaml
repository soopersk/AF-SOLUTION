# uat — v3 stack with production-like sizing (§9: production-like data and the full test
# matrix). Replace every <placeholder>; templates/validate.yaml refuses to render required
# values that still contain one.

storage:
  pvName: pv-airflow-v3-uat
  resourceGroup: <resource-group>
  storageAccount: <storage-account>
  shareName: airflow-v3

airflow:
  images:
    airflow:
      repository: <registry>/airflow
      digest: sha256:<digest>

  config:
    api:
      base_url: https://airflow-v3.uat.<domain>

  ingress:
    apiServer:
      ingressClassName: <ingress-class>
      hosts:
        - name: airflow-v3.uat.<domain>
          tls:
            enabled: true
            secretName: airflow-v3-tls
